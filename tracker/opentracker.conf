# opentracker configuration — Hypertube private tracker
#
# Listens for both HTTP (TCP) and UDP BitTorrent announce/scrape on 6969.
#   - TCP/HTTP is fronted by kamal-proxy → https://opentracker.fractalia.art/announce
#   - UDP is published directly        → udp://opentracker.fractalia.art:6969/announce
listen.tcp  0.0.0.0:6969
listen.udp  0.0.0.0:6969

# Whitelist mode: ONLY info_hashes listed in this file are tracked.
# (opentracker must be compiled with -DWANT_ACCESSLIST_WHITE — see Dockerfile.)
# The file is re-read on SIGHUP, so hashes can be added without a restart.
access.whitelist /etc/opentracker/whitelist.txt

# Where opentracker looks for relative paths / stats templates.
tracker.rootdir /etc/opentracker

# Restrict who may read the live stats pages (/stats?...). Leave commented to
# allow everyone, or set to a specific IP/CIDR you trust.
# access.stats 127.0.0.1
