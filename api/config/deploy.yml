service: hypertube-api
image: 42-course/hypertube-api

servers:
  web:
    - 167.71.57.19

proxy:
  ssl: true
  host: fractalia.art
  app_port: 80

registry:
  server: ghcr.io
  username: 42-Course
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

# Persist Active Storage uploads (user avatars) on the host so they survive
# container redeploys. Maps to config.active_storage.service = :local whose
# disk root is /rails/storage (see config/storage.yml).
volumes:
  - "/var/lib/hypertube/storage:/rails/storage"

env:
  clear:
    DATABASE_HOST: hypertube-api-db
    DATABASE_PORT: "5432"
    DATABASE_NAME: hypertube_production
    DATABASE_USERNAME: hypertube
    RAILS_MAX_THREADS: "5"
    RAILS_LOG_TO_STDOUT: "true"
    REDIS_URL: redis://hypertube-api-redis:6379/0
    FRONTEND_URL: https://hypertube.fractalia.art
    API_URL: https://fractalia.art
    SMTP_HOST: smtp.gmail.com
    SMTP_PORT: "587"
    MAILER_FROM: noreply@fractalia.art
    PROWLARR_URL: https://prowlarr.pulgamecanica.com
    # Public, browser-facing base of the streaming service (returned to the SPA
    # as streaming_url). Fronted by kamal-proxy with TLS.
    STREAMING_SERVICE_URL: https://stream.fractalia.art
    # M2M base for movie->media handoff. The API container and the streaming web
    # container share the `kamal` Docker network, so the API reaches it directly
    # by its network alias without going back out through the proxy.
    STREAMING_SERVICE_INTERNAL_URL: http://streaming-web:4567
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_PASSWORD
    - SECRET_KEY_BASE
    - JWT_SECRET_KEY
    - OMNIAUTH_42_CLIENT_ID
    - OMNIAUTH_42_CLIENT_SECRET
    - OMNIAUTH_GOOGLE_CLIENT_ID
    - OMNIAUTH_GOOGLE_CLIENT_SECRET
    - OMNIAUTH_GITHUB_CLIENT_ID
    - OMNIAUTH_GITHUB_CLIENT_SECRET
    - OMNIAUTH_MICROSOFT_CLIENT_ID
    - OMNIAUTH_MICROSOFT_CLIENT_SECRET
    - SMTP_USERNAME
    - SMTP_PASSWORD
    - OMDB_API_KEY
    - TMDB_API_KEY
    - PROWLARR_API_KEY
    - FRONTEND_URL
    # Shared HMAC secret used to sign viewer stream tickets. MUST match
    # STREAM_TICKET_SECRET in torrent-streaming/.env.production.
    - STREAM_TICKET_SECRET

accessories:
  db:
    image: postgres:16-alpine
    host: 167.71.57.19
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_DB: hypertube_production
        POSTGRES_USER: hypertube
      secret:
        - POSTGRES_PASSWORD
    volumes:
      - /var/lib/postgresql/data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    host: 167.71.57.19
    port: "127.0.0.1:6379:6379"
    volumes:
      - /var/lib/redis/data:/data
