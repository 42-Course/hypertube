services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./api/.env.local
    environment:
      # Postgres reads POSTGRES_* vars on first init.
      # Map them from the DATABASE_* vars in .env.local so both services
      # always use the same credentials.
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-password}
      POSTGRES_DB: ${DATABASE_NAME:-hypertube_development}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      # 1025 = SMTP (apps send mail here), 8025 = web UI to read caught mail.
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    volumes:
      - ./api:/app
      - bundle_cache:/gems
    ports:
      - "3000:3000"
    env_file:
      - ./api/.env.local
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      # The torrent-streaming stack runs in its own Compose project on a separate
      # network. Reach its web service across the host gateway (it publishes 4567
      # on the host). The browser-facing STREAMING_SERVICE_URL stays localhost.
      STREAMING_SERVICE_INTERNAL_URL: http://host.docker.internal:4567
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  bundle_cache:
